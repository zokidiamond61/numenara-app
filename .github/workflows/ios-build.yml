name: Build iOS app (TestFlight)
on: workflow_dispatch
jobs:
  ios:
    runs-on: macos-26
    env:
      ASC_KEY_ID: 84VTLBWZGT
      ASC_ISSUER_ID: 7802d978-510a-41ef-92ac-0f8c29904f27
      TEAM_ID: D62BY46GR4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Select Xcode
        run: ls -d /Applications/Xcode*.app; sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install and prepare iOS project
        run: |
          npm install
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#25124a' --splashBackgroundColor '#120a24'
          python3 scripts/configure_ios.py
          npx cap sync ios
      - name: API key
        env: { APPSTORE_P8: "${{ secrets.APPSTORE_P8 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$APPSTORE_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM=$TEAM_ID \
            MARKETING_VERSION=1.1.1 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | tail -60
          test -d "$RUNNER_TEMP/App.xcarchive"
      - name: Export and upload to App Store Connect (TestFlight)
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist scripts/ios_export.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID
      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
