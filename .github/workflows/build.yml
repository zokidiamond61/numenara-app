name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash scripts/ci_build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        with:
          name: Numenara-${{ github.run_number }}
          path: out/

      - name: Save build log on failure
        if: failure()
        run: |
          cp "$RUNNER_TEMP/build.log" /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rfq . || true
          tail -c 80000 /tmp/build.log > build-tail.log
          git add build-tail.log
          git commit -qm "CI log for run ${{ github.run_number }}"
          git push -f origin ci-log
