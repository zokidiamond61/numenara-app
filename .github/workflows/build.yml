name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#25124a' --splashBackgroundColor '#120a24'
          python3 scripts/configure_android.py
          npx cap sync android

      - name: Decrypt signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Secret KEYSTORE_PASSWORD is missing"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass env:KEYSTORE_PASSWORD

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD" 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          exit ${PIPESTATUS[0]}

      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Numenara-${{ github.run_number }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/Numenara-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Numenara-${{ github.run_number }}
          path: out/

      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/log && cp "$RUNNER_TEMP/gradle.log" /tmp/log/ 2>/dev/null || echo "no gradle log" > /tmp/log/gradle.log
          git checkout --orphan ci-log
          git rm -rfq . || true
          cp /tmp/log/gradle.log build.log
          tail -c 60000 build.log > build-tail.log
          git add build-tail.log
          git commit -qm "CI log for run ${{ github.run_number }}"
          git push -f origin ci-log
